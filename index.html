<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Physics Multiplayer Game</title>
    <link rel="stylesheet" href="style.css">
    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen">
        <div class="menu-container">
            <h1>Element Run</h1>
            
            <div class="selector-container">
                <button id="prev-char-btn" class="arrow-btn">&#9664;</button>
                <div class="character-preview-box">
                    <div id="character-preview" class="circle-char"></div>
                    <span id="char-name">Fire Circle</span>
                </div>
                <button id="next-char-btn" class="arrow-btn">&#9654;</button>
            </div>

            <button id="play-btn">PLAY</button>
        </div>
    </div>

    <!-- Game Screen (Hidden by default) -->
    <div id="game-screen" class="screen hidden">
        <canvas id="game-canvas"></canvas>
        
        <!-- Mobile Touch Controls -->
        <div id="mobile-controls">
            <div class="left-right-group">
                <button id="btn-left" class="control-btn">&#9664;</button>
                <button id="btn-right" class="control-btn">&#9654;</button>
            </div>
            <button id="btn-jump" class="control-btn jump-btn">JUMP</button>
        </div>
    </div>
	<div id="jumpscare-overlay" class="hidden">
        <img src="jumpscare.jpg" alt="SCREAM" id="jumpscare-img">
    </div>

    <script src="client.js"></script>
</body>
</html>
